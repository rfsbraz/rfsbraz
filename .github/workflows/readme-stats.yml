name: README stats

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show the diff without committing"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: readme-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Test the update script
        working-directory: .github/scripts
        run: python3 -m unittest -v test_update_stats

      - name: Fetch numbers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_stats.py README.md

      - name: Commit if a number changed
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if git diff --quiet -- README.md; then
            echo "No rounded value changed, nothing to commit."
            exit 0
          fi
          git diff -- README.md
          if [ "$DRY_RUN" = "true" ] || [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "Dry run or not on master: not committing."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(readme): update stats" -- README.md
          git push origin HEAD:master
